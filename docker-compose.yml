# SriBees Hub static host on the Contabo box: /opt/sribees-hub
# Express's shared Caddy (hub.sribees.com block) proxies to sribees-hub-web:80.
name: sribees-hub

services:
  web:
    image: nginx:1.27-alpine
    container_name: sribees-hub-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html:ro
    mem_limit: 64m
    networks:
      default: {}
      sribees_default:
        aliases: [sribees-hub-web]

networks:
  sribees_default:
    external: true
