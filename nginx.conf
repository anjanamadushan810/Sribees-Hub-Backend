server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # The Hub app reads this on every refresh: never cache it.
    location = /catalog.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # APK file names carry the version code, so a file never changes: cache long.
    location /apk/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The Hub's own APK (name stays fixed, so short cache).
    location = /sribees-hub.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Disposition "attachment; filename=sribees-hub.apk" always;
    }

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }
}
